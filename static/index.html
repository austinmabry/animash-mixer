<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1FF">
<title>Animash Mixer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>Animash Mixer</h1>
    <p class="lede">Snap your animal shelf. Get the five best mixes.</p>
  </header>

  <section class="snap" id="snap">
    <label class="btn btn-big">
      <span class="btn-icon" aria-hidden="true">📷</span>
      Take a photo
      <input type="file" accept="image/*" capture="environment" id="cam" hidden>
    </label>
    <label class="btn btn-big btn-ghost">
      <span class="btn-icon" aria-hidden="true">🖼️</span>
      Pick a screenshot
      <input type="file" accept="image/*" id="pick" hidden>
    </label>
    <button class="linkish" id="manual" type="button">Or type the animals in</button>
  </section>

  <section class="status" id="status" hidden>
    <img id="preview" alt="Your uploaded picture" hidden>
    <div class="working" id="working" hidden>
      <span class="spin" aria-hidden="true"></span>
      <span id="working-text">Finding animals…</span>
    </div>
    <p class="error" id="error" role="alert" hidden></p>
  </section>

  <section class="shelf" id="shelf" hidden>
    <div class="shelf-head">
      <h2>On your shelf</h2>
      <span class="count" id="shelf-count"></span>
    </div>
    <ul class="chips" id="chips" aria-label="Animals you can mix"></ul>
    <div class="add">
      <input id="add-input" list="animal-list" placeholder="Add an animal the camera missed" autocomplete="off" enterkeyhint="done">
      <datalist id="animal-list"></datalist>
      <button class="btn btn-small" id="add-btn" type="button">Add</button>
    </div>
  </section>

  <section class="results" id="results" hidden>
    <h2 id="results-title">Best mixes</h2>
    <ol class="mixes" id="mixes"></ol>
    <p class="note" id="results-note"></p>
    <button class="linkish" id="more" type="button" hidden>Show more mixes</button>
  </section>

  <footer class="foot">
    <button class="linkish" id="reset" type="button">Start over</button>
    <span id="data-note"></span>
  </footer>
</main>
<script src="/static/app.js"></script>
</body>
</html>
