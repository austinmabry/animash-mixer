services:
  animash-mixer:
    build:
      context: .
      args:
        WITH_OCR: "false"
    container_name: animash-mixer
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      # keeps the scraped catalog outside the image so rebuilds don't lose it
      - ./data:/app/data
